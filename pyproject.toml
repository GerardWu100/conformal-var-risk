[project]
name = "conformal-var-risk"
version = "0.1.0"
description = "Offline-first conformal and benchmark Value-at-Risk research pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "scipy>=1.16.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["conformal_var_risk*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
